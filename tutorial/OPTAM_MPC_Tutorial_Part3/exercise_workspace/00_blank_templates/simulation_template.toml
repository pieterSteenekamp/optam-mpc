# Generic nonlinear plant/scenario template: edit every REPLACE.
[simulation]
samples = 0 # REPLACE: positive integer
maximum_solver_failures = 0

[[plant_outputs]]
id = "y1"
cv = "cv_a"
unit = "REPLACE"
initial = 0.0
nominal_rate_per_minute = 0.0 # Keep zero: nonlinear equations own dynamics.

[[plant_outputs]]
id = "y2"
cv = "cv_b"
unit = "REPLACE"
initial = 0.0
nominal_rate_per_minute = 0.0

[[plant_inputs]]
id = "u1"
role = "mv"
controller_id = "mv_a"
unit = "REPLACE"
initial = 0.0

[[plant_inputs]]
id = "u2"
role = "mv"
controller_id = "mv_b"
unit = "REPLACE"
initial = 0.0

[[plant_inputs]]
id = "d1"
role = "measured_dv"
controller_id = "dv_a"
unit = "REPLACE"
initial = 0.0

[[plant_inputs]]
id = "d2"
role = "measured_dv"
controller_id = "dv_b"
unit = "REPLACE"
initial = 0.0

# Delete events for a steady test. Copy for multiple changes.
[[events]]
sample = 0 # REPLACE: zero-based sample at which input changes
input = "d1"
value = 0.0 # REPLACE: absolute input value, not a change

# Copy these check forms for all relevant signals.
[[checks]]
signal = "y1"
metric = "minimum"
limit = 0.0 # REPLACE: minimum permitted over entire run

[[checks]]
signal = "y1"
metric = "maximum"
limit = 0.0 # REPLACE

[[checks]]
signal = "y1"
metric = "final_error"
target = 0.0 # REPLACE
limit = 0.0 # REPLACE: maximum absolute final error

[[checks]]
signal = "u1"
metric = "max_abs_move"
limit = 0.0 # REPLACE: absolute move per sample

[[plots]]
title = "Primary CV 1"
signals = ["y1", "cv.cv_a"]
ylabel = "REPLACE WITH UNITS"

# Optional setpoint change (only for target-based primary CVs):
# [[target_events]]
# sample = 20
# cv = "cv_a"
# value = 1.0
#
# Optional settled-window check:
# [[checks]]
# signal = "y1"
# metric = "max_abs_error"
# target = 1.0
# limit = 0.1
# start_sample = 100
# end_sample = 200

[[plots]]
title = "Primary CV 2"
signals = ["y2", "cv.cv_b"]
ylabel = "REPLACE WITH UNITS"

[[plots]]
title = "Input 1"
signals = ["u1"]
ylabel = "REPLACE WITH UNITS"

[[plots]]
title = "Input 2"
signals = ["u2"]
ylabel = "REPLACE WITH UNITS"

[plant_model]
file = "model.py" # Your copy of model_template.py, engineered for your process.
[plant_model.parameters]
# These match the illustrative template equations. Replace together with Python.
tau_a_seconds = -1.0 # REPLACE
tau_b_seconds = -1.0 # REPLACE
gain_a = 1.0
gain_b = 1.0
curve_a = 0.01
curve_b = 0.01
[plant_model.domain]
# REPLACE: finite lower/upper bounds; include every CV, MV and DV exactly.
cv_a = [-10, 10]
cv_b = [-10, 10]
mv_a = [-1, 1]
mv_b = [-1, 1]
dv_a = [-1, 1]
dv_b = [-1, 1]
