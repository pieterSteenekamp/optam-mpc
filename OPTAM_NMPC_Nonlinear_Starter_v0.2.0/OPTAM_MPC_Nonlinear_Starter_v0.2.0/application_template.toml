[model]
file = "model.py" # Your copy of model_template.py, engineered for your process.
[model.parameters]
# These match the illustrative template equations. Replace together with Python.
tau_a_seconds = -1.0 # REPLACE
tau_b_seconds = -1.0 # REPLACE
gain_a = 1.0
gain_b = 1.0
curve_a = 0.01
curve_b = 0.01
[model.domain]
# REPLACE: finite lower/upper bounds; include every CV, MV and DV exactly.
cv_a = [-10, 10]
cv_b = [-10, 10]
mv_a = [-1, 1]
mv_b = [-1, 1]
dv_a = [-1, 1]
dv_b = [-1, 1]

[[nonlinear_checks]]
name = "REPLACE: independent model calculation"
state = [0, 0]
mvs = [0, 0]
dvs = [0, 0]
expected_next = [0, 0] # REPLACE; add nonzero MV and DV cases, not just equilibrium.
